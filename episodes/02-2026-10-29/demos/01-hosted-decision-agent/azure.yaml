# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: 01-hosted-decision-agent
services:
    existing-project:
        host: azure.ai.project
        endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
    episode02-support-routing:
        project: ./src/SupportRoutingAgent
        host: azure.ai.agent
        language: csharp
        uses:
            - existing-project
        env:
            Decision__Endpoint: ${DECISION_ENDPOINT}
            Decision__Deployment: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: SupportRoutingAgent.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: episode02-support-routing
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
