# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: episode03-wikipedia
infra:
  provider: microsoft.foundry
services:
  foundry-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
  wikipedia-01:
    host: azure.ai.agent
    kind: hosted
    name: wikipedia-01
    description: Wikipedia MCP knowledge assistant for manual guardrail comparisons.
    language: docker
    project: .
    image: ${WIKIPEDIA_AGENT_IMAGE}
    docker:
      imagePassthrough: true
      remoteBuild: false
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      WIKIPEDIA_MCP_ENDPOINT: https://wikipedia.caseyjhand.com/mcp
    uses:
      - foundry-project
  wikipedia-02:
    host: azure.ai.agent
    kind: hosted
    name: wikipedia-02
    description: Wikipedia MCP knowledge assistant for manual guardrail comparisons.
    language: docker
    project: .
    image: ${WIKIPEDIA_AGENT_IMAGE}
    docker:
      imagePassthrough: true
      remoteBuild: false
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
