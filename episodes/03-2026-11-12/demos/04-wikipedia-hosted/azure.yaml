      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      WIKIPEDIA_MCP_ENDPOINT: https://wikipedia.caseyjhand.com/mcp
    uses:
      - foundry-project
  wikipedia-03:
    host: azure.ai.agent
    kind: hosted
    name: wikipedia-03
    description: Wikipedia MCP knowledge assistant for manual guardrail comparisons.
    language: docker
    project: .
    image: ${WIKIPEDIA_AGENT_IMAGE}
