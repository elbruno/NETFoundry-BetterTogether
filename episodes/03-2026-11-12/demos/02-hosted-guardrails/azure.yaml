# Purpose: Describe the standalone hosted egress-guardrail demo.
# Assign the network guardrail separately in Foundry after deploying the unguarded baseline.
# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: better-together-guardrails
services:
  better-together-guardrails:
    host: azure.ai.agent
    project: .
    language: docker
    kind: hosted
    name: better-together-guardrails
    docker:
      platform: linux/amd64
      remoteBuild: true
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
infra:
  provider: microsoft.foundry
