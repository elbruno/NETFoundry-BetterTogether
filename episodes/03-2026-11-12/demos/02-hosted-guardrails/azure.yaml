# Purpose: Run the blog tools locally with AzureCliCredential, not managed identity.
# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: episode03-ebsearch-local
services:
  ebsearch-local:
    host: azure.ai.agent
    project: .
    language: csharp
    kind: hosted
    name: ebsearch-local
    startupCommand: dotnet run --no-launch-profile
    protocols:
      - protocol: responses
        version: 2.0.0
infra:
  provider: microsoft.foundry
