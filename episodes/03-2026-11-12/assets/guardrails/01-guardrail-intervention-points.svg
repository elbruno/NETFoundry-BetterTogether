<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350"><rect width="2400" height="1350" fill="white"/><text x="80" y="117" font-size="62" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">Foundry guardrails: check before the next step</text><text x="80" y="177" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Conceptual agent cycle | content safety controls | agent features are Preview</text><text x="80" y="238" font-size="28" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">A. RECEIVE</text><text x="80" y="538" font-size="28" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">B. USE A TOOL</text><text x="80" y="838" font-size="28" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">C. RESPOND</text><rect x="80" y="265" width="300" height="180" rx="22" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/><text x="104" y="319" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">User</text><text x="104" y="374" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Sends a prompt</text><rect x="580" y="265" width="460" height="180" rx="22" fill="#FFF4CE" stroke="#C45B00" stroke-width="3"/><text x="604" y="319" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">1  User input</text><text x="604" y="374" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Screen submitted content</text><rect x="1240" y="265" width="430" height="180" rx="22" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3"/><text x="1264" y="319" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">Agent runtime</text><text x="1264" y="374" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Runs if input passes</text><line x1="390" y1="355" x2="565" y2="355" stroke="#107C10" stroke-width="5"/><polygon points="565,355 549.2035138859733,363.62965969487567 549.2035138859733,346.37034030512433" fill="#107C10"/><line x1="1050" y1="355" x2="1225" y2="355" stroke="#107C10" stroke-width="5"/><polygon points="1225,355 1209.2035138859733,363.62965969487567 1209.2035138859733,346.37034030512433" fill="#107C10"/><rect x="80" y="565" width="230" height="180" rx="22" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3"/><text x="104" y="619" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">Agent</text><text x="104" y="674" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Proposes</text><text x="104" y="711" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">a tool call</text><rect x="390" y="565" width="310" height="180" rx="22" fill="#FFF4CE" stroke="#C45B00" stroke-width="3"/><text x="414" y="619" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">2  Tool call</text><text x="414" y="674" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Screen tool name</text><text x="414" y="711" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">and arguments</text><rect x="780" y="565" width="230" height="180" rx="22" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/><text x="804" y="619" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">Tool</text><text x="804" y="674" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Executes</text><text x="804" y="711" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">approved call</text><rect x="1090" y="565" width="310" height="180" rx="22" fill="#FFF4CE" stroke="#C45B00" stroke-width="3"/><text x="1114" y="619" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">3  Response</text><text x="1114" y="674" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Screen returned</text><text x="1114" y="711" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">tool content</text><rect x="1480" y="565" width="230" height="180" rx="22" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3"/><text x="1504" y="619" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">Agent</text><text x="1504" y="674" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Consumes</text><text x="1504" y="711" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">checked result</text><line x1="320" y1="655" x2="375" y2="655" stroke="#107C10" stroke-width="5"/><polygon points="375,655 359.2035138859733,663.6296596948756 359.2035138859733,646.3703403051244" fill="#107C10"/><line x1="710" y1="655" x2="765" y2="655" stroke="#107C10" stroke-width="5"/><polygon points="765,655 749.2035138859733,663.6296596948756 749.2035138859733,646.3703403051244" fill="#107C10"/><line x1="1020" y1="655" x2="1075" y2="655" stroke="#107C10" stroke-width="5"/><polygon points="1075,655 1059.2035138859733,663.6296596948756 1059.2035138859733,646.3703403051244" fill="#107C10"/><line x1="1410" y1="655" x2="1465" y2="655" stroke="#107C10" stroke-width="5"/><polygon points="1465,655 1449.2035138859733,663.6296596948756 1449.2035138859733,646.3703403051244" fill="#107C10"/><text x="400" y="799" font-size="29" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">Tool call + tool response: Preview; supported tools only.</text><rect x="80" y="865" width="350" height="180" rx="22" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3"/><text x="104" y="919" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">Agent runtime</text><text x="104" y="974" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Produces final content</text><rect x="630" y="865" width="460" height="180" rx="22" fill="#FFF4CE" stroke="#C45B00" stroke-width="3"/><text x="654" y="919" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">4  Output</text><text x="654" y="974" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Screen before release*</text><rect x="1290" y="865" width="380" height="180" rx="22" fill="#DFF6DD" stroke="#107C10" stroke-width="3"/><text x="1314" y="919" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">User / app</text><text x="1314" y="974" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Receives approved text</text><line x1="440" y1="955" x2="615" y2="955" stroke="#107C10" stroke-width="5"/><polygon points="615,955 599.2035138859733,963.6296596948756 599.2035138859733,946.3703403051244" fill="#107C10"/><line x1="1100" y1="955" x2="1275" y2="955" stroke="#107C10" stroke-width="5"/><polygon points="1275,955 1259.2035138859733,963.6296596948756 1259.2035138859733,946.3703403051244" fill="#107C10"/><rect x="1810" y="265" width="510" height="310" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="3"/><text x="1840" y="331" font-size="36" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">A named guardrail</text><text x="1840" y="391" font-size="31" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Each control specifies:</text><text x="1840" y="434" font-size="31" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Risk to detect</text><text x="1840" y="477" font-size="31" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Intervention point</text><text x="1840" y="520" font-size="31" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Response action</text><rect x="1810" y="625" width="510" height="420" rx="22" fill="#FDE7E9" stroke="#D13438" stroke-width="3"/><text x="1840" y="691" font-size="36" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">If a control blocks</text><text x="1840" y="755" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Do not advance past</text><text x="1840" y="797" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">that checkpoint.</text><text x="1840" y="839" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000"></text><text x="1840" y="881" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Handle the service signal;</text><text x="1840" y="923" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">do not assume HTTP 200</text><text x="1840" y="965" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">means unfiltered content.</text><text x="80" y="1147" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">*Default synchronous output mode shown. Async filtering may release content before a later block.</text><text x="80" y="1197" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Arbitrary MCP tools are not listed for agent tool-call/response moderation. Verify current tool support.</text><text x="80" y="1273" font-size="23" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Sources: Microsoft Learn, Guardrails overview; Intervention points; Hosted agent content safety. Checked 2026-11-12.</text></svg>