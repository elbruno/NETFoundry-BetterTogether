<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350"><rect width="2400" height="1350" fill="white"/><text x="80" y="115" font-size="60" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">One policy concept. Different enforcement boundaries.</text><text x="80" y="176" font-size="31" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Assignment map, not a serial pipeline. Availability depends on feature, protocol, region and tool.</text><rect x="690" y="215" width="1020" height="100" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="3"/><text x="735" y="273" font-size="38" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">Named guardrail / Responsible AI (RAI) policy</text><line x1="900" y1="325" x2="620" y2="370" stroke="#6B7280" stroke-width="5"/><polygon points="620,370 634.2270125356364,358.97311855913716 636.965688464022,376.01376878020346" fill="#6B7280"/><line x1="1500" y1="325" x2="1780" y2="370" stroke="#6B7280" stroke-width="5"/><polygon points="1780,370 1763.034311535978,376.01376878020346 1765.7729874643637,358.97311855913716" fill="#6B7280"/><polyline points="690,265 40,265 40,960 65,960" fill="none" stroke="#6B7280" stroke-width="3"/><line x1="40" y1="960" x2="65" y2="960" stroke="#6B7280" stroke-width="5"/><polygon points="65,960 49.203513885973294,968.6296596948756 49.203513885973294,951.3703403051244" fill="#6B7280"/><polyline points="1710,265 2360,265 2360,960 2335,960" fill="none" stroke="#6B7280" stroke-width="3"/><line x1="2360" y1="960" x2="2335" y2="960" stroke="#6B7280" stroke-width="5"/><polygon points="2335,960 2350.7964861140267,951.3703403051244 2350.7964861140267,968.6296596948756" fill="#6B7280"/><rect x="80" y="380" width="1080" height="340" rx="22" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/><text x="115" y="445" font-size="43" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">MODEL DEPLOYMENT</text><text x="115" y="502" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">Prompts + completions</text><text x="115" y="560" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Configure the policy on the deployment.</text><text x="115" y="602" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Direct model callers use that deployment&#x27;s filter,</text><text x="115" y="644" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">even when the calling application runs locally.</text><rect x="1240" y="380" width="1080" height="340" rx="22" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3"/><text x="1275" y="445" font-size="43" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">AGENT  (Preview)</text><text x="1275" y="502" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">Input + output + supported tool checkpoints</text><text x="1275" y="560" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Assign a policy to a Foundry Agent Service agent.</text><text x="1275" y="602" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Custom agent policy can override model inheritance.</text><text x="1275" y="644" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Hosted-agent boundary filtering is independent.*</text><rect x="80" y="790" width="1080" height="340" rx="22" fill="#FFF4CE" stroke="#C45B00" stroke-width="3"/><text x="115" y="855" font-size="43" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">TOOLBOX VERSION</text><text x="115" y="912" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">Tool inputs + outputs</text><text x="115" y="970" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Attach a named policy to the toolbox version.</text><text x="115" y="1012" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Filtering runs at the toolbox layer,</text><text x="115" y="1054" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">independently of model-level content filtering.</text><rect x="1240" y="790" width="1080" height="340" rx="22" fill="#DFF6DD" stroke="#107C10" stroke-width="3"/><text x="1275" y="855" font-size="43" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">HOSTED NETWORK EGRESS  (Preview)</text><text x="1275" y="912" font-size="32" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#000000">Outbound destinations, not content meaning</text><text x="1275" y="970" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Attach egress rules through the hosted agent&#x27;s RAI policy.</text><text x="1275" y="1012" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Ordered rules: first match, then default action.</text><text x="1275" y="1054" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Audit logs would-deny traffic; Enforce blocks denials.</text><text x="80" y="1191" font-size="26" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">*Hosted agents: no rai_config means no agent-boundary content guardrail. Model-call filtering can still apply.</text><text x="80" y="1236" font-size="26" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">These controls do not replace tool permissions, managed identity, DLP, human approval or application validation.</text><text x="80" y="1302" font-size="22" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#000000">Sources: Microsoft Learn, Guardrails overview; Toolbox guide; Hosted agent content safety and guardrail setup. Checked 2026-11-12.</text></svg>