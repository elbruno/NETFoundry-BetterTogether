name: Series website

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'episodes/**/README.md'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'episodes/**/README.md'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
